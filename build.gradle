plugins {
    id 'java'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'csse3030'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

pitest {
    junit5PluginVersion = '1.2.1'
    targetClasses = ['csse3030.week8.*']
    targetTests = ['csse3030.week8.*']
    outputFormats = ['HTML']
}

// testQ1, testQ3, and testQ5 all run the same underlying PIT analysis.
// What differs between questions is the content of the test sources at
// the time each task is run, not the task configuration itself.
['testQ1', 'testQ3', 'testQ5'].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        description = "Runs PIT mutation testing (alias for ${taskName})."
        dependsOn tasks.named('pitest')
    }
}
